# The Cloudflare Pages project getjpm.sh deploys to (`npm run deploy`).
name = "getjpm"
pages_build_output_dir = "dist"
compatibility_date = "2026-09-01"

# Install-script counts (functions/_middleware.js): one point per install.sh or install.ps1 handed
# out, holding only which script and the path asked for. `npm run installs` reads them.
[[analytics_engine_datasets]]
binding = "INSTALLS"
dataset = "getjpm_installs"

# The public count at /api/installs (functions/api/installs.js) reads that dataset through the
# Analytics Engine SQL API. The account id is not a secret (it is in every dashboard URL). The
# token, with "Account Analytics: Read" only, is a secret, set once with
#   npx wrangler pages secret put CF_ANALYTICS_TOKEN --project-name getjpm
# Without it the script count is null and the page shows only GitHub's download count.
[vars]
CF_ACCOUNT_ID = "7001118f85b48a64b8239b870e497802"
